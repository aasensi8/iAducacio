<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Exemple d’etiquetatge d’imatges</title>
<desc id="desc">Una activitat visual demana seleccionar les imatges que contenen cotxes. Tres de sis targetes amb vehicles estan marcades.</desc>
